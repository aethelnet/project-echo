name: Deploy Project Echo Serverless Atlas to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: shadow-museum-atlas/package-lock.json

      - name: Install lightweight forensic export dependencies
        run: |
          pip install --no-cache-dir fastapi uvicorn httpx pydantic python-multipart PyMuPDF scipy numpy Pillow

      - name: Export real Provenance Snapshot, Visual RANSAC Benchmark & Flagship PDFs
        run: |
          python3 scripts/export_static_snapshot.py

      - name: Build Shadow Museum Atlas frontend
        working-directory: shadow-museum-atlas
        run: |
          npm ci
          npm run build

      - name: Prepare GitHub Pages bundle (CNAME + 404 SPA fallback)
        run: |
          cp shadow-museum-atlas/dist/index.html shadow-museum-atlas/dist/404.html
          printf "echo.aethelburg.network\n" > shadow-museum-atlas/dist/CNAME
          touch shadow-museum-atlas/dist/.nojekyll

      - name: Publish static bundle to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd shadow-museum-atlas/dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Project Echo v2.3 Serverless Provenance Atlas to echo.aethelburg.network"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
