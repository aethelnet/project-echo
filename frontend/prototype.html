<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Echo | Heritage & Lineage Tracer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0a0a0c;
            color: #e2e8f0;
            overflow: hidden;
        }
        .glass-panel {
            background: rgba(20, 20, 25, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .accent-glow {
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }
        .node text {
            pointer-events: none;
            font-size: 12px;
            font-weight: 300;
            fill: #e2e8f0;
        }
        .link {
            stroke: #4a5568;
            stroke-opacity: 0.6;
        }
        #graph-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }
        .ui-layer {
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative">

    <!-- D3 Graph Background -->
    <div id="graph-container"></div>

    <!-- UI Overlay -->
    <div class="ui-layer flex flex-col items-center w-full max-w-2xl px-6">
        
        <div class="glass-panel p-8 rounded-3xl w-full flex flex-col items-center transition-all duration-700" id="search-box">
            <h1 class="text-4xl font-semibold mb-2 tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-[#D4AF37] to-[#E53E3E]">Project Echo</h1>
            <p class="text-sm text-gray-400 mb-8 text-center max-w-md">
                Algorithmic restitution framework. Cross-referencing colonial archives, flight routes, and oral histories to reconstruct stolen heritage.
            </p>

            <div class="w-full flex bg-gray-900 rounded-full border border-gray-700 overflow-hidden focus-within:border-[#D4AF37] transition-colors">
                <input type="text" id="query-input" placeholder="Enter name, artifact, or region (e.g. 'Benin Bronze', 'Mwangi')" class="w-full bg-transparent px-6 py-4 outline-none text-white placeholder-gray-500">
                <button onclick="runTrace()" class="px-8 bg-gradient-to-r from-[#D4AF37] to-[#B7791F] text-black font-semibold hover:opacity-90 transition-opacity">
                    TRACE
                </button>
            </div>
        </div>

        <!-- Results Card (Hidden by default) -->
        <div id="results-card" class="glass-panel mt-6 p-6 rounded-2xl w-full opacity-0 pointer-events-none transform translate-y-4 transition-all duration-700 max-h-[60vh] overflow-y-auto custom-scrollbar">
            <div class="flex items-center justify-between mb-4 sticky top-0 bg-[#141419]/90 backdrop-blur-md pb-2 z-10 border-b border-gray-700">
                <h3 class="text-xl font-semibold text-white">LGNN Topology Matches</h3>
                <span class="px-3 py-1 bg-green-900/50 text-green-400 rounded-full text-xs font-semibold border border-green-800" id="match-count">Scanning...</span>
            </div>
            
            <!-- Dynamic Results Container -->
            <div id="results-list" class="space-y-6 flex flex-col">
                <!-- Results injected here -->
            </div>
            
            <button onclick="resetView()" class="mt-6 text-sm text-[#D4AF37] hover:underline sticky bottom-0 bg-[#141419]/90 w-full text-left pt-2 pb-1 z-10">Reset Trace</button>
        </div>
    </div>

    <script>
        // Dynamic LGNN Graph Data (starts empty)
        let nodes = [];
        let links = [];

        let simulation, svg, link, node;

        function initGraph() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            svg = d3.select("#graph-container").append("svg")
                .attr("width", width)
                .attr("height", height);

            simulation = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(links).id(d => d.id).distance(150))
                .force("charge", d3.forceManyBody().strength(-300))
                .force("center", d3.forceCenter(width / 2, height / 2));

            link = svg.append("g")
                .attr("class", "links")
                .selectAll("line")
                .data(links)
                .enter().append("line")
                .attr("class", "link")
                .attr("stroke-width", d => Math.sqrt(d.value));

            node = svg.append("g")
                .attr("class", "nodes")
                .selectAll("g")
                .data(nodes)
                .enter().append("g")
                .style("opacity", 0); // Hidden initially

            // SVG objects are kept dynamic so we can update them
            // We define a separate function to update the graph
        }
        
        function updateGraph() {
            // Re-bind links
            link = svg.select(".links").selectAll("line").data(links);
            link.exit().remove();
            let linkEnter = link.enter().append("line")
                .attr("class", "link")
                .attr("stroke-width", d => Math.sqrt(d.value));
            link = linkEnter.merge(link);

            // Re-bind nodes
            node = svg.select(".nodes").selectAll("g").data(nodes, d => d.id);
            node.exit().remove();
            
            let nodeEnter = node.enter().append("g")
                .style("opacity", 1);
                
            nodeEnter.append("circle")
                .attr("r", d => d.size)
                .attr("fill", d => d.color)
                .attr("stroke", "#fff")
                .attr("stroke-width", 1.5)
                .attr("class", "shadow-lg");

            nodeEnter.append("text")
                .attr("dx", 15)
                .attr("dy", ".35em")
                .text(d => d.id);
                
            node = nodeEnter.merge(node);
            
            simulation.nodes(nodes);
            simulation.force("link").links(links);
            simulation.alpha(1).restart();

            simulation.on("tick", () => {
                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node
                    .attr("transform", d => `translate(${d.x},${d.y})`);
            });
        }

        async function runTrace() {
            const input = document.getElementById("query-input").value;
            if(!input) return;

            // Animate search box up
            const searchBox = document.getElementById("search-box");
            searchBox.style.transform = "translateY(-20px)";
            
            // Show Graph
            node.transition().duration(1000).style("opacity", 1);
            
            try {
                document.getElementById("match-count").innerText = "Contacting Project Echo Engine...";
                
                // Fetch from our real Python Backend (LGNN Engine)
                const engineRes = await fetch(`http://127.0.0.1:5000/trace?q=${encodeURIComponent(input)}`);
                const engineData = await engineRes.json();
                
                const resultsList = document.getElementById("results-list");
                resultsList.innerHTML = ""; // clear previous
                
                if (!engineData.results || engineData.results.length === 0) {
                    document.getElementById("match-count").innerText = "0 Matches";
                    resultsList.innerHTML = `<p class="text-gray-400 text-sm">No high-confidence matches found. Try 'Benin'.</p>`;
                } else {
                    document.getElementById("match-count").innerText = `${engineData.results.length} High-Confidence Topologies Found`;
                    
                    // Render each result sorted by actual calculated confidence
                    engineData.results.forEach((obj) => {
                        const title = obj.title;
                        const origin = obj.origin;
                        const image = obj.image;
                        const url = obj.url || "https://www.metmuseum.org";
                        const confidence = obj.confidence.toFixed(1);
                        const creditLine = obj.creditLine;
                        
                        const itemHtml = `
                        <div class="border-b border-gray-700/50 pb-4 last:border-0 last:pb-0">
                            <div class="flex items-center justify-between mb-2">
                                <h4 class="text-lg font-semibold text-[#D4AF37]">${title}</h4>
                                <span class="text-xs ${obj.confidence > 80 ? 'text-red-400' : 'text-gray-500'} font-mono">Conf: ${confidence}%</span>
                            </div>
                            <div class="flex gap-4">
                                ${image ? `<img src="${image}" class="w-20 h-20 object-cover rounded-md border border-gray-600 flex-shrink-0">` : ''}
                                <div class="flex-1 space-y-1">
                                    <p class="text-sm text-gray-300"><span class="text-gray-500">Origin:</span> ${origin}</p>
                                    <p class="text-sm text-gray-300"><span class="text-gray-500">Source:</span> Met Museum (NY)</p>
                                    <p class="text-xs text-gray-400 mt-1 italic">${creditLine}</p>
                                    <a href="${url}" target="_blank" class="text-xs text-blue-400 hover:text-blue-300 flex items-center gap-1 mt-2 inline-flex">
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                        Original Archival Record
                                    </a>
                                </div>
                            </div>
                        </div>
                        `;
                        resultsList.insertAdjacentHTML('beforeend', itemHtml);
                    });
                    
                    // UPDATE GRAPH WITH REAL TOPOLOGY
                    nodes = engineData.nodes;
                    links = engineData.links;
                    updateGraph();
                }
            } catch (e) {
                console.error("Failed to load live data", e);
            }

            // Simulate AI processing time
            setTimeout(() => {
                const results = document.getElementById("results-card");
                results.style.opacity = "1";
                results.style.pointerEvents = "auto";
                results.style.transform = "translateY(0)";
                
                // Add a glowing pulse to the query node
                node.filter(d => d.id === "Query")
                    .select("circle")
                    .transition()
                    .duration(1000)
                    .attr("r", 25)
                    .attr("stroke", "#D4AF37")
                    .attr("stroke-width", 4)
                    .style("filter", "drop-shadow(0 0 10px rgba(212,175,55,0.8))");
            }, 1000);
        }

        function resetView() {
            document.getElementById("query-input").value = "";
            document.getElementById("search-box").style.transform = "translateY(0)";
            
            const results = document.getElementById("results-card");
            results.style.opacity = "0";
            results.style.pointerEvents = "none";
            results.style.transform = "translateY(10px)";
            
            node.transition().duration(500).style("opacity", 0);
        }

        // Init on load
        window.onload = initGraph;
    </script>
</body>
</html>
