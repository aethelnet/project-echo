<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Echo | Heritage & Lineage Tracer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1a1a24 0%, #09090b 100%);
            color: #f4f4f5;
            overflow: hidden;
            margin: 0;
        }
        .glass-panel {
            background: rgba(20, 20, 24, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .glass-panel:hover {
            border-color: rgba(212, 175, 55, 0.3);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.9), 0 0 40px rgba(212, 175, 55, 0.1);
        }
        .accent-glow {
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
        .node text {
            pointer-events: none;
            font-size: 14px;
            font-weight: 300;
            fill: #e4e4e7;
            text-shadow: 0px 2px 10px rgba(0,0,0,1);
            letter-spacing: 0.5px;
        }
        .link {
            stroke: #3f3f46;
            stroke-opacity: 0.4;
        }
        #graph-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
            mix-blend-mode: screen;
        }
        .ui-layer {
            position: relative;
            z-index: 10;
        }
        .search-btn {
            background: linear-gradient(135deg, #D4AF37 0%, #AA771C 100%);
            color: #000;
            transition: all 0.3s ease;
        }
        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(212, 175, 55, 0.6);
            filter: brightness(1.1);
        }
        input::placeholder {
            color: #71717a !important;
        }
        /* Custom Scrollbar for dark mode */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.3); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(212, 175, 55, 0.6); }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative">

    <!-- D3 Graph Background -->
    <div id="graph-container"></div>

    <!-- UI Overlay -->
    <div class="ui-layer flex flex-col items-center w-full max-w-2xl px-6">
        
        <div class="glass-panel p-8 rounded-3xl w-full flex flex-col items-center transition-all duration-700" id="search-box">
            <h1 class="text-4xl font-semibold mb-2 tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-[#D4AF37] to-[#E53E3E]">Project Echo</h1>
            <p class="text-sm text-gray-400 mb-8 text-center max-w-md leading-relaxed">
                Algorithmic restitution framework. Cross-referencing colonial archives, flight routes, and oral histories to reconstruct stolen heritage using PyTorch LGNNs.
            </p>

            <div class="w-full flex bg-black/40 rounded-full border border-gray-800 overflow-hidden focus-within:border-[#D4AF37] focus-within:shadow-[0_0_15px_rgba(212,175,55,0.2)] transition-all duration-300">
                <input type="text" id="query-input" placeholder="Enter name, artifact, or region (e.g. 'Benin Bronze')" class="w-full bg-transparent px-6 py-4 outline-none text-gray-100 placeholder-gray-600 font-light tracking-wide">
                <button onclick="runTrace()" class="search-btn px-10 font-bold tracking-widest text-sm uppercase">
                    TRACE
                </button>
            </div>
        </div>

        <!-- Results Card (Hidden by default) -->
        <div id="results-card" class="glass-panel mt-6 p-6 rounded-2xl w-full opacity-0 pointer-events-none transform translate-y-4 transition-all duration-700 max-h-[60vh] overflow-y-auto custom-scrollbar">
            <div class="flex items-center justify-between mb-6 sticky top-0 bg-[#121217]/90 backdrop-blur-md pb-4 pt-2 z-10 border-b border-gray-800">
                <h3 class="text-xl font-semibold text-gray-100 flex items-center gap-3">
                    <span class="w-2 h-2 rounded-full bg-[#D4AF37] animate-pulse"></span>
                    LGNN Topology Matches
                </h3>
                <span class="px-4 py-1.5 bg-[#D4AF37]/10 text-[#D4AF37] rounded-full text-xs font-bold border border-[#D4AF37]/30 tracking-wider shadow-[0_0_10px_rgba(212,175,55,0.2)]" id="match-count">STANDBY</span>
            </div>
            
            <!-- Dynamic Results Container -->
            <div id="results-list" class="space-y-6 flex flex-col">
                <!-- Results injected here -->
            </div>
            
            <button onclick="resetView()" class="mt-6 text-sm text-[#D4AF37] hover:text-white transition-colors sticky bottom-0 bg-gradient-to-t from-[#121217] via-[#121217]/90 to-transparent w-full text-center py-4 z-10 font-medium tracking-wide">INITIALIZE NEW TRACE</button>
        </div>
    </div>

    <script>
        // Dynamic LGNN Graph Data (starts empty)
        let nodes = [];
        let links = [];

        let simulation, svg, link, node;

        function initGraph() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            svg = d3.select("#graph-container").append("svg")
                .attr("width", width)
                .attr("height", height);

            simulation = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(links).id(d => d.id).distance(150))
                .force("charge", d3.forceManyBody().strength(-300))
                .force("center", d3.forceCenter(width * 0.65, height / 2));

            link = svg.append("g")
                .attr("class", "links")
                .selectAll("line")
                .data(links)
                .enter().append("line")
                .attr("class", "link")
                .attr("stroke-width", d => Math.sqrt(d.value));

            node = svg.append("g")
                .attr("class", "nodes")
                .selectAll("g")
                .data(nodes)
                .enter().append("g")
                .style("opacity", 0); // Hidden initially

            // SVG objects are kept dynamic so we can update them
            // We define a separate function to update the graph
            
            simulation.on("tick", () => {
                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node
                    .attr("transform", d => `translate(${d.x},${d.y})`);
            });
        }
        
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        function updateGraph() {
            // Re-bind links
            link = svg.select(".links").selectAll("line").data(links);
            link.exit().remove();
            let linkEnter = link.enter().append("line")
                .attr("class", "link")
                .attr("stroke-width", d => Math.sqrt(d.value));
            link = linkEnter.merge(link);

            // Re-bind nodes
            node = svg.select(".nodes").selectAll("g").data(nodes, d => d.id);
            node.exit().remove();
            
            let nodeEnter = node.enter().append("g")
                .style("opacity", 1);
                
            nodeEnter.append("circle")
                .attr("r", d => d.size)
                .attr("fill", d => d.color)
                .attr("stroke", "#fff")
                .attr("stroke-width", 1.5)
                .attr("class", "shadow-lg cursor-grab active:cursor-grabbing");

            nodeEnter.append("text")
                .attr("dx", 15)
                .attr("dy", ".35em")
                .text(d => d.id);
                
            nodeEnter.call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));
                
            node = nodeEnter.merge(node);
            
            simulation.nodes(nodes);
            simulation.force("link").links(links);
            simulation.alpha(1).restart();
        }

        async function runTrace() {
            const input = document.getElementById("query-input").value;
            if(!input) return;

            // Animate search box up
            const searchBox = document.getElementById("search-box");
            searchBox.style.transform = "translateY(-20px)";
            
            // Show Graph
            node.transition().duration(1000).style("opacity", 1);
            
            try {
                document.getElementById("match-count").innerText = "Contacting Project Echo LGNN Engine...";
                const resultsList = document.getElementById("results-list");
                resultsList.innerHTML = ""; // clear previous
                
                // ==========================================
                // PYTORCH LGNN BACKEND (TRUE TENSOR ROUTING)
                // ==========================================
                const searchRes = await fetch(`http://localhost:5000/trace?q=${encodeURIComponent(input)}`);
                const searchData = await searchRes.json();
                
                if (!searchData.results || searchData.results.length === 0) {
                    document.getElementById("match-count").innerText = "0 Matches";
                    resultsList.innerHTML = `<p class="text-gray-600 text-sm">No high-confidence matches found in the archive.</p>`;
                    return;
                }
                
                document.getElementById("match-count").innerText = `${searchData.results.length} High-Confidence Topologies Found`;
                
                // Use the true graph topology calculated by the backend!
                nodes = searchData.nodes;
                links = searchData.links;

                searchData.results.forEach((obj) => {
                    const title = obj.title;
                    const origin = obj.origin;
                    const image = obj.image;
                    const confidence = obj.confidence.toFixed(1);
                    const creditLine = obj.creditLine;
                    
                    const itemHtml = `
                    <div class="border-b border-gray-200/50 pb-4 last:border-0 last:pb-0">
                        <div class="flex items-center justify-between mb-2">
                            <h4 class="text-lg font-semibold text-[#D4AF37]">${title}</h4>
                            <span class="text-xs ${obj.confidence > 65 ? 'text-red-400' : 'text-gray-500'} font-mono">Conf: ${confidence}%</span>
                        </div>
                        <div class="flex gap-4">
                            ${image ? `<img src="${image}" class="w-20 h-20 object-cover rounded-md border border-gray-300 flex-shrink-0">` : ''}
                            <div class="flex-1 space-y-1">
                                <p class="text-sm text-gray-700"><span class="text-gray-500">Origin:</span> ${origin}</p>
                                <p class="text-sm text-gray-700"><span class="text-gray-500">Source:</span> Met Museum Archive</p>
                                <p class="text-xs text-gray-600 mt-1 italic">${creditLine}</p>
                            </div>
                        </div>
                    </div>
                    `;
                    resultsList.insertAdjacentHTML('beforeend', itemHtml);
                });
                
                updateGraph();
            } catch (e) {
                console.error("Failed to load live data", e);
            }

            setTimeout(() => {
                const results = document.getElementById("results-card");
                results.style.opacity = "1";
                results.style.pointerEvents = "auto";
                results.style.transform = "translateY(0)";
                
                node.filter(d => d.id === "Query")
                    .select("circle")
                    .transition()
                    .duration(1000)
                    .attr("r", 25)
                    .attr("stroke", "#D4AF37")
                    .attr("stroke-width", 4)
                    .style("filter", "drop-shadow(0 0 10px rgba(212,175,55,0.8))");
            }, 1000);
        }
        
        function resetView() {
            document.getElementById("query-input").value = "";
            document.getElementById("search-box").style.transform = "translateY(0)";
            
            const results = document.getElementById("results-card");
            results.style.opacity = "0";
            results.style.pointerEvents = "none";
            results.style.transform = "translateY(10px)";
            
            node.transition().duration(500).style("opacity", 0);
        }

        // Init on load
        window.onload = initGraph;
    </script>
</body>
</html>
