<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Archival ink seal plate -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#141413" stroke="#2F2E2A" stroke-width="2"/>
  <!-- Concentric provenance echo waves radiating from origin -->
  <path d="M 19 29 A 16 16 0 0 1 35 45" stroke="#F7F6F2" stroke-opacity="0.30" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 19 16 A 29 29 0 0 1 48 45" stroke="#F7F6F2" stroke-opacity="0.16" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Colliding multigraph provenance arcs: official archival trace vs. forensic crimson -->
  <path d="M 19 45 Q 43 43 45 19" stroke="#F7F6F2" stroke-opacity="0.88" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M 19 45 Q 21 21 45 19" stroke="#DC2626" stroke-width="4.2" stroke-linecap="round"/>
  <!-- Subtle crimson resonance halo on contested depot node -->
  <circle cx="45" cy="19" r="10.5" fill="#DC2626" fill-opacity="0.24"/>
  <!-- Origin / heritage node (archival paper) -->
  <circle cx="19" cy="45" r="6.6" fill="#F7F6F2"/>
  <circle cx="19" cy="45" r="2.2" fill="#141413"/>
  <!-- Contested depot / forensic collision node (crimson with paper rim) -->
  <circle cx="45" cy="19" r="6.4" fill="#DC2626" stroke="#F7F6F2" stroke-width="2"/>
</svg>
